name: Reusable build, bump, and deploy

on:
  workflow_call:
    inputs:
      # ─── identity ────────────────────────────────────────────────────────────
      team:
        description: "Tenant: charts/<team>/<app>/ in charts_repo, label team=<team> on the Application, <team>/ in Vault paths"
        type: string
        default: ${{ vars.TEAM }}
      app:
        description: "App: charts/<team>/<app>/"
        type: string
        required: true
      components:
        description: |
          YAML list, one image per entry:
            name                   — .components.<name> in chart values; `main` = single-component app
            docker_context         — build context (default .)
            docker_file            — Dockerfile path inside docker_context (default Dockerfile)
            docker_registry        — image without tag (default ghcr.io/<repo>, plus -<name> unless name is `main` or repeats the repo name)
            docker_build_args      — multiline KEY=VALUE, merged with Vault
            paths                  — multiline globs (like on.push.paths); build only if a changed file matches
            chart_init_containers  — multiline initContainer names, get the same image
            chart_components_extra — multiline other .components.* on the same image
        type: string
        required: true

      # ─── docker ──────────────────────────────────────────────────────────────
      docker_registry_username:
        description: "Registry user (default github.actor)"
        type: string
        default: ""
      docker_tag:
        description: "Image tag override (default <UTC>_<branch>_<sha>)"
        type: string
        default: ""
      docker_tags_extra:
        description: "Multiline extra image tags"
        type: string
        default: ""
      docker_prefix_tag:
        description: "Monorepo: prefix tags with <app>-"
        type: boolean
        default: false
      docker_latest_branches:
        description: "Branches that also get the `latest` tag"
        type: string
        default: "main,master"
      docker_cache:
        description: "buildx cache in GitHub Actions cache"
        type: boolean
        default: false
      docker_image_visibility:
        description: "ghcr.io package visibility: private | public. Empty = no check"
        type: string
        default: "private"
      docker_scan:
        description: "Scan each image with Trivy: HIGH and CRITICAL counts in the summary, the findings as an artifact. Never fails the run"
        type: boolean
        default: true

      # ─── vault (build-args, deploy credentials) ──────────────────────────────
      vault_server:
        description: "Vault URL; build-args read from <vault_mount_ci>/<team>/<app>[/<component>]/<env> via OIDC. Empty = off"
        type: string
        default: ${{ vars.VAULT_SERVER }}
      vault_auth_path:
        description: "Path of the JWT auth method for GitHub OIDC, auth/<vault_auth_path>; needed with vault_server"
        type: string
        default: ${{ vars.VAULT_AUTH_PATH }}
      vault_role:
        description: "Role on auth/<vault_auth_path>; needed with vault_server"
        type: string
        default: ${{ vars.VAULT_ROLE }}
      vault_mount_ci:
        description: "KV-v2 mount with build-args; needed with vault_server"
        type: string
        default: ${{ vars.VAULT_MOUNT_CI }}
      vault_mount_runtime:
        description: "KV-v2 mount with the runtime envs; only linked from the report. Empty = no link"
        type: string
        default: ${{ vars.VAULT_MOUNT_RUNTIME }}

      # ─── env ─────────────────────────────────────────────────────────────────
      env:
        description: "Force env (workflow_dispatch). Empty = from branch"
        type: string
        default: ""
      env_prod_branches:
        description: "Branches that deploy to env_prod"
        type: string
        default: "main,master,release"
      env_prod:
        description: "Prod env name"
        type: string
        default: "prod"
      env_default:
        description: "Env for all other branches"
        type: string
        default: "stg"

      # ─── charts repo ─────────────────────────────────────────────────────────
      charts_repo:
        description: "GitOps repo with charts/<team>/<app>/. Empty = build only, no bump and no deploy"
        type: string
        default: ${{ vars.CHARTS_REPO }}
      charts_values_path:
        description: "Values file to bump, relative to charts/<team>/<app>/ (default values/<env>.yaml, else values.yaml)"
        type: string
        default: ""

      # ─── argocd ──────────────────────────────────────────────────────────────
      argocd_server:
        description: "ArgoCD host. Empty = no gate, no sync"
        type: string
        default: ${{ vars.ARGOCD_SERVER }}
      argocd_app:
        description: "Application name (default: by labels app/env/team)"
        type: string
        default: ""
      argocd_timeout:
        description: "Seconds to wait for sync + health"
        type: number
        default: 600

      # ─── cleanup ─────────────────────────────────────────────────────────────
      cleanup_enabled:
        description: "Prune old GHCR versions (keeps latest, docker_tags_extra, every tag the chart names and every image a pod runs)"
        type: boolean
        default: true
      cleanup_keep:
        description: "Versions to keep"
        type: number
        default: 3

      # ─── runner ──────────────────────────────────────────────────────────────
      runs_on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"

    secrets:
      DOCKER_REGISTRY_PASSWORD:
        required: false
        description: "Non-ghcr registry password"
      CHARTS_REPO_TOKEN:
        required: false
        description: "PAT, contents:write on charts_repo. Needed with charts_repo unless CHARTS_REPO_SSH_KEY comes from Vault"
      ARGOCD_AUTH_TOKEN:
        required: false
        description: "ArgoCD API token"
      TELEGRAM_TOKEN:
        required: false
        description: "Bot token for failure alerts"
      TELEGRAM_CHAT:
        required: false
        description: "Chat ID"
      TELEGRAM_THREAD:
        required: false
        description: "Topic ID"

jobs:
  plan:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      env: ${{ steps.plan.outputs.env }}
      tag: ${{ steps.plan.outputs.tag }}
      created: ${{ steps.plan.outputs.created }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      skipped: ${{ steps.plan.outputs.skipped }}
      apps: ${{ steps.apps.outputs.apps }}
      deploy_enabled: ${{ steps.apps.outputs.deploy_enabled }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build path filters
        id: filters
        if: ${{ github.event_name == 'push' && github.event.forced != true }}
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          f=$(yq -o=json '.' <<< "$COMPONENTS" | jq -r '
            [ .[] | select((.paths // "") != "")
                  | {(.name): ((.paths|split("\n")|map(sub("^\\s+";"")|sub("\\s+$";""))|map(select(length>0))))} ] | add // {}')
          if [[ "$(jq 'length' <<< "$f")" == "0" ]]; then echo "▸ no component declares paths — filtering skipped"; exit 0; fi
          delim="EOF_$(openssl rand -hex 16)"
          { echo "yaml<<${delim}"; yq -P '.' <<< "$f"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Resolve the base of the path filter
        id: base
        if: ${{ steps.filters.outputs.yaml != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          delivered='
            [.jobs[] | {seg: (.name | split(" / ") | last), c: .conclusion}]
            | ([.[] | select(.seg == "plan")] | length > 0 and all(.c == "success"))
              and ([.[] | select(.seg | test("^build( |$)"))] | all(.c == "success" or .c == "skipped"))
              and ([.[] | select(.seg == "bump")] | all(.c == "success" or .c == "skipped"))'
          wf=${WORKFLOW_REF%%@*}; wf=${wf##*/}; api="repos/${GITHUB_REPOSITORY}"
          base=""
          while IFS=$'\t' read -r id sha conclusion; do
            [[ "$id" != "$GITHUB_RUN_ID" ]] || continue
            if [[ "$conclusion" != "success" ]]; then
              [[ "$conclusion" == "failure" && "$(gh api "${api}/actions/runs/${id}/jobs?per_page=100" --jq "$delivered" 2>/dev/null)" == "true" ]] || continue
            fi
            base=$sha; break
          done < <(gh api -X GET "${api}/actions/workflows/${wf}/runs" -f branch="$BRANCH" -f event=push -f status=completed -F per_page=20 \
                     --jq '.workflow_runs[] | [.id, .head_sha, .conclusion] | @tsv' 2>/dev/null || true)
          if [[ -n "$base" ]]; then
            rel=$(gh api "${api}/compare/${base}...${GITHUB_SHA}?per_page=1" --jq .status 2>/dev/null) || rel=""
            [[ "$rel" == "ahead" || "$rel" == "identical" ]] || { echo "▸ ${base} is not behind this push (${rel:-unknown})"; base=""; }
          fi
          if [[ -n "$base" ]]; then
            echo "▸ changes are counted from ${base}, the last push whose builds all reached the chart"
          else
            base="$GITHUB_REF"; echo "▸ no such push of ${wf} on ${BRANCH} — changes are counted from the previous push"
          fi
          echo "ref=${base}" >> "$GITHUB_OUTPUT"

      - name: Detect changed components
        id: changed
        if: ${{ steps.filters.outputs.yaml != '' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: ${{ steps.filters.outputs.yaml }}

      - name: Resolve plan
        id: plan
        env:
          COMPONENTS: ${{ inputs.components }}
          IN_ENV: ${{ inputs.env }}
          IN_PROD_BRANCHES: ${{ inputs.env_prod_branches }}
          IN_PROD_ENV: ${{ inputs.env_prod }}
          IN_DEFAULT_ENV: ${{ inputs.env_default }}
          IN_TAG: ${{ inputs.docker_tag }}
          IN_TAGS_EXTRA: ${{ inputs.docker_tags_extra }}
          IN_PREFIX_TAG: ${{ inputs.docker_prefix_tag }}
          IN_LATEST_BRANCHES: ${{ inputs.docker_latest_branches }}
          IN_APP: ${{ inputs.app }}
          IN_TEAM: ${{ inputs.team }}
          IN_CHARTS_REPO: ${{ inputs.charts_repo }}
          IN_VALUES_PATH: ${{ inputs.charts_values_path }}
          IN_ARGOCD_SERVER: ${{ inputs.argocd_server }}
          IN_VAULT_SERVER: ${{ inputs.vault_server }}
          IN_VAULT_ROLE: ${{ inputs.vault_role }}
          IN_VAULT_AUTH_PATH: ${{ inputs.vault_auth_path }}
          IN_VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          IN_VAULT_MOUNT_RUNTIME: ${{ inputs.vault_mount_runtime }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FILTERED: ${{ steps.changed.outcome == 'success' }}
          CHANGED: ${{ steps.changed.outputs.changes }}
          DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          sanitize() { printf '%s' "$1" | tr -c '[:alnum:]_.-' '-' | tr -s '-'; }
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          in_csv() { local csv="$1" needle="$2" b; IFS=',' read -ra arr <<< "$csv"; for b in "${arr[@]}"; do b=$(strip "$b"); [[ -n "$b" && "$needle" == "$b" ]] && return 0; done; return 1; }
          emit_empty() { { echo "env="; echo "tag="; echo "matrix=[]"; echo "count=0"; echo "skipped=$1"; } >> "$GITHUB_OUTPUT"; exit 0; }

          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "▸ ref type '${REF_TYPE}' — only branch pushes are supported"
            emit_empty "ref type '${REF_TYPE}' is not a branch"
          fi

          IN_APP=$(strip "$IN_APP")
          if [[ -z "$(strip "$IN_TEAM")" && -n "$(strip "$IN_CHARTS_REPO$IN_VAULT_SERVER")" ]]; then
            echo "::error::charts_repo or vault_server is set, so team is needed too - set the variable TEAM on the organization or the repository, or pass the input"; exit 1
          fi
          envn=$(strip "$IN_ENV")
          if [[ -z "$envn" ]]; then
            if in_csv "$IN_PROD_BRANCHES" "$REF_NAME"; then envn=$(strip "$IN_PROD_ENV"); else envn=$(strip "$IN_DEFAULT_ENV"); fi
          fi
          named() { [[ "$2" =~ ^[A-Za-z0-9]([A-Za-z0-9_${3:-}-]*[A-Za-z0-9])?$ ]] || { echo "::error::$1 '$2' may hold only letters, digits and ${3:+. }- _ in between"; exit 1; }; }
          named app "$IN_APP" .; named env "$envn" .
          [[ -z "$(strip "$IN_TEAM")" ]] || named team "$(strip "$IN_TEAM")" .
          shaped() { [[ -z "$2" || "$2" =~ $3 ]] || { echo "::error::$1 '$2' is not $4"; exit 1; }; }
          shaped vault_server "$(strip "$IN_VAULT_SERVER")" '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$' "an http(s) URL without a query or credentials"
          shaped argocd_server "$(strip "$IN_ARGOCD_SERVER")" '^[A-Za-z0-9.-]+(:[0-9]+)?$' "a host name with an optional port"
          shaped charts_repo "$(strip "$IN_CHARTS_REPO")" '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' "an owner/repository pair"
          shaped vault_role "$(strip "$IN_VAULT_ROLE")" '^[A-Za-z0-9._-]+$' "a role name"
          for p in "vault_auth_path|$(strip "$IN_VAULT_AUTH_PATH")" "vault_mount_ci|$(strip "$IN_VAULT_MOUNT_CI")" "vault_mount_runtime|$(strip "$IN_VAULT_MOUNT_RUNTIME")" "charts_values_path|$(strip "$IN_VALUES_PATH")"; do
            shaped "${p%%|*}" "${p#*|}" '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$' "a relative path"
            [[ "/${p#*|}/" != */../* && "/${p#*|}/" != */./* ]] || { echo "::error::${p%%|*} '${p#*|}' may not hold . or .. segments"; exit 1; }
          done

          # monorepo: app name not in repo name → shared ghcr.io/<repo> image
          repo_lc=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          app_pfx=""; [[ "${REPO#*/}" != *"$IN_APP"* ]] && app_pfx="$IN_APP"

          tag=$(strip "$IN_TAG")
          if [[ -z "$tag" ]]; then
            tag="$(date -u +'%Y.%m.%d_%H.%M')_$(sanitize "$REF_NAME")_$(git rev-parse --short HEAD)"
          else
            tag=$(sanitize "$tag")
          fi
          [[ "$IN_PREFIX_TAG" == "true" && -n "$app_pfx" ]] && tag="${app_pfx}-${tag}"

          latest=""
          if in_csv "$IN_LATEST_BRANCHES" "$REF_NAME"; then
            latest="latest"; [[ "$IN_PREFIX_TAG" == "true" && -n "$app_pfx" ]] && latest="${app_pfx}-latest"
          fi

          [[ "$FILTERED" == "true" ]] && echo "▸ components with changes: ${CHANGED:-[]}"

          comp="${RUNNER_TEMP}/components.json"
          yq -o=json '.' <<< "$COMPONENTS" > "$comp"
          n=$(jq 'length' "$comp")
          [[ "$n" -gt 0 ]] || { echo "::error::inputs.components is empty"; exit 1; }
          dup=$(jq -r '[.[].name] | group_by(.) | map(select(length>1)[0]) | join(", ")' "$comp")
          [[ -z "$dup" ]] || { echo "::error::duplicate component names: ${dup}"; exit 1; }

          matrix="[]"; skipped=""
          for i in $(seq 0 $((n-1))); do
            c=$(jq -c ".[$i]" "$comp")
            name=$(jq -r '.name // empty' <<< "$c"); [[ -n "$name" ]] || { echo "::error::components[$i] has no name"; exit 1; }
            named "components[$i].name" "$name"
            while IFS= read -r n; do named "${name}: chart name" "$n"; done < <(jq -r '(.chart_init_containers // ""), (.chart_components_extra // "") | split("\n")[] | gsub("\\s";"") | select(length>0)' <<< "$c")
            flag_key="deploy"; [[ "$name" != "main" ]] && flag_key="deploy_${name}"
            flag=$(jq -r --arg k "$flag_key" '.[$k] // empty' <<< "$DISPATCH_INPUTS")
            if [[ "$EVENT" == "workflow_dispatch" && "$flag" == "false" ]]; then
              echo "▸ ${name}: ${flag_key}=false — skipped"; skipped+="${name}: unchecked in dispatch; "; continue
            fi

            paths=$(jq -r '.paths // empty' <<< "$c")
            if [[ -n "$paths" && "$FILTERED" == "true" ]] \
               && ! jq -e --arg n "$name" 'index($n)' <<< "${CHANGED:-[]}" >/dev/null; then
              echo "▸ ${name}: no changed file matches paths — skipped"; skipped+="${name}: no matching changes; "; continue
            fi

            registry=$(jq -r '.docker_registry // empty' <<< "$c" | tr -d '[:space:]')
            if [[ -z "$registry" ]]; then
              registry="ghcr.io/${repo_lc}"
              [[ "$name" != "main" && "${repo_lc##*/}" != "$name" ]] && registry="${registry}-${name}"
            fi
            [[ "$registry" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]] || { echo "::error::${name}: docker_registry '${registry}' is not an image name"; exit 1; }
            tags="${registry}:${tag}"
            [[ -n "$latest" ]] && tags+=$'\n'"${registry}:${latest}"
            while IFS= read -r t; do
              t=$(sanitize "$(strip "$t")"); [[ -z "$t" ]] && continue
              [[ "$IN_PREFIX_TAG" == "true" && -n "$app_pfx" ]] && t="${app_pfx}-${t}"
              tags+=$'\n'"${registry}:${t}"
            done <<< "${IN_TAGS_EXTRA:-}"

            entry=$(jq -n --argjson c "$c" --arg name "$name" --arg registry "$registry" --arg image "${registry}:${tag}" --arg tags "$tags" '{
              name: $name,
              docker_context: ($c.docker_context // "."),
              docker_file: ((($c.docker_context // ".") + "/" + ($c.docker_file // "Dockerfile")) | sub("^\\./";"")),
              label: (if $name == "main" then "" else " " + $name end),
              docker_registry: $registry,
              docker_image: $image,
              docker_tags: $tags,
              docker_build_args: ($c.docker_build_args // ""),
              chart_init_containers: (($c.chart_init_containers // "") | split("\n") | map(gsub("\\s";"")) | map(select(length>0)) | join(",")),
              chart_components_extra: (($c.chart_components_extra // "") | split("\n") | map(gsub("\\s";"")) | map(select(length>0)) | join(","))
            }')
            matrix=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$matrix")
            echo "▸ ${name}: build → ${registry}:${tag}"
          done

          clash=$(jq -r '[.[].docker_registry] | group_by(.) | map(select(length>1)[0]) | join(", ")' <<< "$matrix")
          [[ -z "$clash" ]] || { echo "::error::components share one image, they would overwrite each other: ${clash}. Give each its own docker_registry, or merge them with chart_components_extra"; exit 1; }

          count=$(jq 'length' <<< "$matrix")
          {
            echo "env=$envn"
            echo "tag=$tag"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "matrix=$matrix"
            echo "count=$count"
            echo "skipped=${skipped%; }"
          } >> "$GITHUB_OUTPUT"

      - name: Read CI credentials from Vault
        if: ${{ steps.plan.outputs.count != '0' }}
        env:
          VAULT_SERVER: ${{ inputs.vault_server }}
          VAULT_ROLE: ${{ inputs.vault_role }}
          VAULT_AUTH_PATH: ${{ inputs.vault_auth_path }}
          VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          WANT: ARGOCD_AUTH_TOKEN
          FALLBACK_ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ inputs.argocd_server }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          export_env() { # <name> <value>: masked, multi-line safe
            while IFS= read -r line; do [[ -n "$line" ]] && echo "::add-mask::$line"; done <<< "$2"
            local delim; delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          VAULT_SERVER=$(strip "$VAULT_SERVER"); VAULT_SERVER=${VAULT_SERVER%/}
          VAULT_ROLE=$(strip "$VAULT_ROLE"); VAULT_AUTH_PATH=$(strip "$VAULT_AUTH_PATH"); VAULT_MOUNT_CI=$(strip "$VAULT_MOUNT_CI")
          data="{}"
          if [[ -n "$VAULT_SERVER" && -n "$VAULT_ROLE" && -n "$VAULT_AUTH_PATH" && -n "$VAULT_MOUNT_CI" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            aud=$(jq -rn --arg v "$VAULT_SERVER" '$v | @uri')
            if jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -er .value) \
              && token=$(curl -fsSL --data "{\"role\":\"${VAULT_ROLE}\",\"jwt\":\"${jwt}\"}" "${VAULT_SERVER}/v1/auth/${VAULT_AUTH_PATH}/login" | jq -er .auth.client_token); then
              echo "::add-mask::$token"
              data=$(curl -fsSL -H "X-Vault-Token: $token" "${VAULT_SERVER}/v1/${VAULT_MOUNT_CI}/data/ci/shared" | jq -c '.data.data | objects') || data=""
              [[ -n "$data" ]] || data="{}"
            else
              echo "::warning::Vault login failed - CI credentials come from secrets"
            fi
          fi
          server=$(strip "${ARGOCD_SERVER:-}"); pinned=$(jq -r '.ARGOCD_SERVER // empty' <<< "$data")
          if [[ " $WANT " == *" ARGOCD_AUTH_TOKEN "* && -n "$server" && -n "$pinned" && "$pinned" != "$server" ]]; then
            echo "::error::the ArgoCD token of Vault ${VAULT_MOUNT_CI}/ci/shared belongs to '${pinned}', but argocd_server is '${server}'"; exit 1
          fi
          for name in $WANT; do
            value=$(jq -r --arg n "$name" '.[$n] // empty' <<< "$data")
            if [[ -n "$value" ]]; then export_env "$name" "$value"; echo "▸ $name from Vault ${VAULT_MOUNT_CI}/ci/shared"; continue; fi
            fallback_var="FALLBACK_$name"
            if [[ -n "${!fallback_var:-}" ]]; then export_env "$name" "${!fallback_var}"; echo "▸ $name from the secret"; fi
          done

      - name: Discover ArgoCD applications
        id: apps
        if: ${{ steps.plan.outputs.count != '0' }}
        env:
          ARGOCD_SERVER: ${{ inputs.argocd_server }}
          APP_OVERRIDE: ${{ inputs.argocd_app }}
          CHARTS_REPO: ${{ inputs.charts_repo }}
          APP_NAME: ${{ inputs.app }}
          TEAM: ${{ inputs.team }}
          ENV: ${{ steps.plan.outputs.env }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          ARGOCD_SERVER=$(strip "$ARGOCD_SERVER"); ARGOCD_AUTH_TOKEN=$(strip "${ARGOCD_AUTH_TOKEN:-}"); APP_OVERRIDE=$(strip "$APP_OVERRIDE")
          emit() { local d; d="EOF_$(openssl rand -hex 16)"; { echo "deploy_enabled=$1"; echo "apps<<$d"; [[ -z "${3:-}" ]] || printf '%s\n' "$3"; echo "$d"; } >> "$GITHUB_OUTPUT"; }

          if [[ -z "$CHARTS_REPO" ]]; then
            [[ -z "$ARGOCD_SERVER" ]] || echo "::warning::argocd_server is set but charts_repo is not — images are built, nothing is deployed"
            echo "▸ charts_repo not set — build only, no bump and no sync"; emit true 0 ""; exit 0
          fi
          if [[ -z "$ARGOCD_SERVER" ]]; then echo "▸ argocd_server not set — no gate, no sync"; emit true 0 ""; exit 0; fi
          [[ -n "${ARGOCD_AUTH_TOKEN:-}" ]] || { echo "::error::argocd_server is set but ARGOCD_AUTH_TOKEN is in neither Vault <vault_mount_ci>/ci/shared nor the secret"; exit 1; }
          if [[ -n "$APP_OVERRIDE" ]]; then
            [[ "$APP_OVERRIDE" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]] || { echo "::error::argocd_app '${APP_OVERRIDE}' is not an Application name"; exit 1; }
            echo "▸ explicit argocd_app='${APP_OVERRIDE}'"; emit true 1 "$APP_OVERRIDE"; exit 0
          fi

          selector="app=$(strip "$APP_NAME"),env=$(strip "$ENV"),team=$(strip "$TEAM")"
          resp=$(curl -sS -G -w '\n%{http_code}' -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            --data-urlencode "selector=${selector}" "https://${ARGOCD_SERVER}/api/v1/applications") || resp=""
          code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
          [[ "$code" == "200" ]] || { echo "::error::ArgoCD API returned HTTP ${code:-000} for selector '${selector}'"; exit 1; }

          apps=$(printf '%s' "$body" | jq -r '.items[]?.metadata.name // empty')
          odd=$(grep -vE '^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$' <<< "$apps" | awk 'NF' | head -n1 || true)
          [[ -z "$odd" ]] || { echo "::error::ArgoCD returned a name that is not an Application name"; exit 1; }
          count=$(printf '%s\n' "$apps" | awk 'NF' | wc -l | tr -d ' ')
          if [[ -z "$apps" ]]; then
            echo "::notice::No ArgoCD Application carries the labels '${selector}' — env '${ENV}' is not deployed, nothing to build. Label the Application, or name it in argocd_app"
            emit false 0 ""
          else
            emit true "$count" "$apps"
          fi

  build:
    name: build${{ matrix.label }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' && needs.plan.outputs.deploy_enabled == 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ matrix.docker_registry }}
          username: ${{ inputs.docker_registry_username != '' && inputs.docker_registry_username || github.actor }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve build-args
        id: args
        env:
          STATIC_ARGS: ${{ matrix.docker_build_args }}
          VAULT_SERVER: ${{ inputs.vault_server }}
          VAULT_ROLE: ${{ inputs.vault_role }}
          VAULT_AUTH_PATH: ${{ inputs.vault_auth_path }}
          VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          KV_PATH: ${{ matrix.name == 'main'
                      && format('{0}/data/{1}/{2}/{3}', inputs.vault_mount_ci, inputs.team, inputs.app, needs.plan.outputs.env)
                      || format('{0}/data/{1}/{2}/{3}/{4}', inputs.vault_mount_ci, inputs.team, inputs.app, matrix.name, needs.plan.outputs.env) }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          csv_line() { local s=$1 nl=$'\n'; [[ "$s" == *[\",]* || "$s" == *"$nl"* || "$s" == *$'\r'* ]] && s="\"${s//\"/\"\"}\""; printf '%s' "$s"; }
          VAULT_SERVER=$(strip "$VAULT_SERVER"); VAULT_SERVER=${VAULT_SERVER%/}; VAULT_ROLE=$(strip "$VAULT_ROLE"); KV_PATH=$(strip "$KV_PATH")

          merged=$(awk 'NF' <<< "${STATIC_ARGS:-}")

          if [[ -n "$VAULT_SERVER" ]]; then
            VAULT_AUTH_PATH=$(strip "$VAULT_AUTH_PATH"); VAULT_MOUNT_CI=$(strip "$VAULT_MOUNT_CI")
            if [[ -z "$VAULT_AUTH_PATH" || -z "$VAULT_ROLE" || -z "$VAULT_MOUNT_CI" ]]; then
              echo "::error::vault_server is set, so vault_auth_path, vault_role and vault_mount_ci are needed too - set the variables VAULT_AUTH_PATH, VAULT_ROLE and VAULT_MOUNT_CI on the organization or the repository, or pass the inputs"
              exit 1
            fi
            display_path="${KV_PATH/\/data\///}"
            [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "::error::vault_server is set but the job has no OIDC token - the caller workflow needs 'permissions: id-token: write'"; exit 1; }

            aud=$(jq -rn --arg v "$VAULT_SERVER" '$v | @uri')
            jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -r .value)
            login=$(curl -sSL -w '\n%{http_code}' --data "{\"role\":\"${VAULT_ROLE}\",\"jwt\":\"${jwt}\"}" \
              "${VAULT_SERVER}/v1/auth/${VAULT_AUTH_PATH}/login")
            login_code=$(printf '%s' "$login" | tail -n1)
            token=$(printf '%s' "$login" | sed '$d' | jq -r '.auth.client_token // empty' 2>/dev/null || true)
            if [[ -z "$token" ]]; then
              why=$(printf '%s' "$login" | sed '$d' | jq -r '(.errors // []) | join("; ")' 2>/dev/null || true)
              echo "::error::Vault login failed with HTTP ${login_code} for role '${VAULT_ROLE}' on auth path '${VAULT_AUTH_PATH}' with the audience '${VAULT_SERVER}': ${why:-no message}. Check that the role's bound_audiences and bound_claims match this run, including letter case"
              exit 1
            fi
            echo "::add-mask::$token"

            resp=$(curl -sSL -w '\n%{http_code}' -H "X-Vault-Token: $token" "${VAULT_SERVER}/v1/${KV_PATH}")
            code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
            case "$code" in
              200)
                entries=$(jq -r '.data.data | if type == "object" then to_entries[] | "\(.key)=\(.value)" | @base64 else error("no data") end' <<< "$body" 2>/dev/null) \
                  || { echo "::error::Vault answered ${display_path} with something that is not a secret"; exit 1; }
                count=0
                while IFS= read -r b64; do
                  [[ -n "$b64" ]] || continue
                  kv=$(base64 -d <<< "$b64")
                  while IFS= read -r line; do [[ -z "$line" ]] || echo "::add-mask::$line"; done <<< "${kv#*=}"
                  merged+="${merged:+$'\n'}$(csv_line "$kv")"; count=$((count+1))
                done <<< "$entries"
                echo "▸ ${count} build-arg(s) from ${display_path}" ;;
              404)
                echo "▸ no build-args in Vault at ${display_path} — static args only" ;;
              *)
                echo "::error::Vault read ${display_path} returned HTTP ${code}"; exit 1 ;;
            esac
          fi

          delim="EOF_$(openssl rand -hex 8)"
          { echo "merged<<${delim}"; printf '%s\n' "$merged"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ matrix.docker_context }}
          file: ${{ matrix.docker_file }}
          push: true
          provenance: false
          tags: ${{ matrix.docker_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.created=${{ needs.plan.outputs.created }}
          build-args: ${{ steps.args.outputs.merged }}
          cache-from: ${{ inputs.docker_cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.docker_cache && 'type=gha,mode=max' || '' }}

      - name: Verify image visibility
        if: ${{ inputs.docker_image_visibility != '' && startsWith(matrix.docker_registry, 'ghcr.io/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ matrix.docker_registry }}
          WANT: ${{ inputs.docker_image_visibility }}
        run: |
          set -euo pipefail
          path=${REGISTRY#ghcr.io/}
          owner=${path%%/*}
          pkg=${path#*/}
          enc=${pkg//\//%2F}
          kind=orgs
          got=$(gh api "/orgs/${owner}/packages/container/${enc}" --jq .visibility 2>/dev/null) \
            || { kind=users; got=$(gh api "/users/${owner}/packages/container/${enc}" --jq .visibility 2>/dev/null); } \
            || { echo "::warning::cannot read visibility of ${REGISTRY}"; exit 0; }
          if [[ "$got" == "$WANT" ]]; then
            echo "visibility=${got}"
            exit 0
          fi
          echo "::error::${REGISTRY} is ${got}, the input docker_image_visibility expects ${WANT}. Change the input, or the package at ${GITHUB_SERVER_URL}/${kind}/${owner}/packages/container/${enc}/settings"
          exit 1

      - name: Persist build meta
        if: always()
        env:
          APP: ${{ inputs.app }}
          COMPONENT: ${{ matrix.name }}
          STATUS: ${{ job.status }}
        run: |
          dir="${RUNNER_TEMP}/build-meta/$(printf '%s' "$APP" | tr -d '[:space:]')/${COMPONENT}"
          mkdir -p "$dir" && echo "STATUS=${STATUS}" > "${dir}/build-meta.env"

      - name: Upload build meta
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-meta-${{ inputs.app }}-${{ matrix.name }}
          path: ${{ runner.temp }}/build-meta
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  scan:
    name: scan${{ matrix.label }}
    needs: [plan, build]
    if: ${{ !cancelled() && inputs.docker_scan && needs.build.result != 'skipped' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Scan the image with Trivy
        env:
          TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          IMAGE: ${{ matrix.docker_image }}
          REGISTRY: ${{ matrix.docker_registry }}
          APP: ${{ inputs.app }}
          COMPONENT: ${{ matrix.name }}
          REGISTRY_USERNAME: ${{ inputs.docker_registry_username != '' && inputs.docker_registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/scan/$(printf '%s' "$APP" | tr -d '[:space:]')/${COMPONENT}"; mkdir -p "$out"
          export TRIVY_USERNAME="$REGISTRY_USERNAME" TRIVY_PASSWORD="$REGISTRY_PASSWORD"
          if [[ -z "$TRIVY_PASSWORD" && "$REGISTRY" == ghcr.io/* ]]; then TRIVY_PASSWORD="$PACKAGES_TOKEN"; fi
          trivy() { docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "${out}:/out" "$TRIVY_IMAGE" "$@"; }
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --timeout 15m --format json --output /out/report.json "$IMAGE"
          trivy convert --scanners vuln --format table --output /out/report.txt /out/report.json
          jq -r '[.Results[]?.Vulnerabilities[]?] as $v
            | def n(s): [$v[] | select(.Severity == s)] | length;
              def f(s): [$v[] | select(.Severity == s and ((.FixedVersion // "") != ""))] | length;
              "CRITICAL=\(n("CRITICAL"))", "CRITICAL_FIXABLE=\(f("CRITICAL"))", "HIGH=\(n("HIGH"))", "HIGH_FIXABLE=\(f("HIGH"))"' "${out}/report.json" > "${out}/counts.env"
          echo "▸ ${IMAGE}: $(paste -sd' ' "${out}/counts.env")"

      - name: Upload the scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-${{ inputs.app }}-${{ matrix.name }}
          path: ${{ runner.temp }}/scan
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  cleanup:
    needs: [plan, build, bump, sync]
    if: >-
      ${{ !cancelled() && inputs.cleanup_enabled && (
            needs.sync.result == 'success'
            || (inputs.argocd_server == '' && needs.bump.result == 'success')
            || (inputs.charts_repo == '' && needs.build.result == 'success')
          ) }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      packages: write
    outputs:
      note: ${{ steps.pkg.outputs.note }}
    steps:
      - name: Resolve cleanup parameters
        id: pkg
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          TAGS_EXTRA: ${{ inputs.docker_tags_extra }}
          PREFIX_TAG: ${{ inputs.docker_prefix_tag }}
          APP: ${{ inputs.app }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BUMP_RESULT: ${{ needs.bump.result }}
          IMAGE_REFS: ${{ needs.bump.outputs.image_refs }}
          IMAGE_REFS_COUNT: ${{ needs.bump.outputs.image_refs_count }}
          SYNC_RESULT: ${{ needs.sync.result }}
          LIVE_IMAGES: ${{ needs.sync.outputs.images }}
          LIVE_IMAGES_COUNT: ${{ needs.sync.outputs.images_count }}
        run: |
          set -euo pipefail
          mapfile -t regs < <(jq -r '.[].docker_registry | select(startswith("ghcr.io/"))' <<< "$MATRIX" | sort -u)
          if [[ ${#regs[@]} -eq 0 ]]; then echo "▸ no ghcr.io image in this run — nothing to prune"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          arrived() { # <what> <lines> <count>
            local got; got=$(awk 'NF' <<< "$2" | wc -l | tr -d ' ')
            if [[ -n "$3" && "$got" == "$3" ]]; then return 0; fi
            echo "::warning::$1 did not arrive complete (${got} of ${3:-unknown}) — nothing is pruned"
            { echo "skip=true"; echo "note=nothing pruned: $1 are incomplete"; } >> "$GITHUB_OUTPUT"; exit 0
          }
          [[ "$BUMP_RESULT" != "success" ]] || arrived "the image references of the chart" "${IMAGE_REFS:-}" "$IMAGE_REFS_COUNT"
          [[ "$SYNC_RESULT" != "success" ]] || arrived "the images ArgoCD reports as running" "${LIVE_IMAGES:-}" "$LIVE_IMAGES_COUNT"
          mapfile -t accounts < <(printf '%s\n' "${regs[@]}" | sed 's|^ghcr.io/||; s|/.*||' | sort -u)
          if [[ ${#accounts[@]} -ne 1 ]]; then
            echo "::error::components span several registry accounts (${accounts[*]}); cleanup supports one"
            exit 1
          fi
          names=$(printf '%s\n' "${regs[@]}" | sed 's|^ghcr.io/[^/]*/||' | paste -sd' ' -)
          account=${accounts[0]}
          [[ "$(gh api "users/${account}" --jq .type)" == "User" ]] && account=user
          echo "account=${account}" >> "$GITHUB_OUTPUT"
          echo "name=${names}" >> "$GITHUB_OUTPUT"
          echo "▸ pruning: ${names}"
          app_pfx=""; [[ "${REPO#*/}" != *"$APP"* ]] && app_pfx="$APP"
          if [[ "$PREFIX_TAG" == "true" && -n "$app_pfx" ]]; then
            protection="${app_pfx}-* !${app_pfx}-latest"
            while IFS= read -r t; do t="${t//[[:space:]]/}"; [[ -n "$t" ]] && protection+=" !${app_pfx}-${t}"; done <<< "${TAGS_EXTRA:-}"
          else
            protection="!latest"
            while IFS= read -r t; do t="${t//[[:space:]]/}"; [[ -n "$t" ]] && protection+=" !${t}"; done <<< "${TAGS_EXTRA:-}"
          fi
          declare -A kept=()
          keep() { # <why> <repository> <tag>
            local reg
            if [[ ! "$3" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ || -n "${kept[$3]:-}" ]]; then return 0; fi
            for reg in "${regs[@]}"; do
              if [[ -z "$2" || "${2,,}" == "${reg,,}" ]]; then kept[$3]=1; protection+=" !$3"; echo "▸ kept, $1: ${2:-<any image>}:$3"; return 0; fi
            done
          }
          while IFS='|' read -r r t; do keep "the chart names it" "$r" "$t"; done <<< "${IMAGE_REFS:-}"
          while IFS= read -r img; do
            img=${img%%@*}
            if [[ "$img" == *:* ]]; then keep "a pod runs it" "${img%:*}" "${img##*:}"; fi
          done <<< "${LIVE_IMAGES:-}"
          echo "protection=${protection}" >> "$GITHUB_OUTPUT"

      - name: Prune image versions
        if: ${{ steps.pkg.outputs.skip != 'true' }}
        env:
          RETENTION_IMAGE: ghcr.io/snok/container-retention-policy:v3.1.0@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112
          RUST_LOG: container_retention_policy=INFO
          ACCOUNT: ${{ steps.pkg.outputs.account }}
          TOKEN: ${{ github.token }}
          NAMES: ${{ steps.pkg.outputs.name }}
          TAGS: ${{ steps.pkg.outputs.protection }}
          KEEP: ${{ inputs.cleanup_keep }}
        run: |
          docker run --rm -e RUST_LOG -e GITHUB_REPOSITORY_OWNER "$RETENTION_IMAGE" \
            "--account=${ACCOUNT}" "--token=${TOKEN}" "--image-names=${NAMES}" "--image-tags=${TAGS}" \
            --shas-to-skip= --tag-selection=both "--keep-n-most-recent=${KEEP}" --timestamp-to-use=updated_at --cut-off=0s --dry-run=false

  bump:
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && inputs.charts_repo != '' && (
            needs.build.result == 'success'
            || (needs.build.result != 'skipped' && needs.plan.outputs.count != '1')
          ) }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      values_file: ${{ steps.bump.outputs.values_file }}
      values_url: ${{ steps.bump.outputs.values_url }}
      bumped: ${{ steps.bump.outputs.bumped }}
      image_refs: ${{ steps.bump.outputs.image_refs }}
      image_refs_count: ${{ steps.bump.outputs.image_refs_count }}
    steps:
      - name: Read CI credentials from Vault
        env:
          VAULT_SERVER: ${{ inputs.vault_server }}
          VAULT_ROLE: ${{ inputs.vault_role }}
          VAULT_AUTH_PATH: ${{ inputs.vault_auth_path }}
          VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          WANT: CHARTS_REPO_SSH_KEY
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          export_env() { # <name> <value>: masked, multi-line safe
            while IFS= read -r line; do [[ -n "$line" ]] && echo "::add-mask::$line"; done <<< "$2"
            local delim; delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          VAULT_SERVER=$(strip "$VAULT_SERVER"); VAULT_SERVER=${VAULT_SERVER%/}
          VAULT_ROLE=$(strip "$VAULT_ROLE"); VAULT_AUTH_PATH=$(strip "$VAULT_AUTH_PATH"); VAULT_MOUNT_CI=$(strip "$VAULT_MOUNT_CI")
          data="{}"
          if [[ -n "$VAULT_SERVER" && -n "$VAULT_ROLE" && -n "$VAULT_AUTH_PATH" && -n "$VAULT_MOUNT_CI" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            aud=$(jq -rn --arg v "$VAULT_SERVER" '$v | @uri')
            if jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -er .value) \
              && token=$(curl -fsSL --data "{\"role\":\"${VAULT_ROLE}\",\"jwt\":\"${jwt}\"}" "${VAULT_SERVER}/v1/auth/${VAULT_AUTH_PATH}/login" | jq -er .auth.client_token); then
              echo "::add-mask::$token"
              data=$(curl -fsSL -H "X-Vault-Token: $token" "${VAULT_SERVER}/v1/${VAULT_MOUNT_CI}/data/ci/shared" | jq -c '.data.data | objects') || data=""
              [[ -n "$data" ]] || data="{}"
            else
              echo "::warning::Vault login failed - CI credentials come from secrets"
            fi
          fi
          server=$(strip "${ARGOCD_SERVER:-}"); pinned=$(jq -r '.ARGOCD_SERVER // empty' <<< "$data")
          if [[ " $WANT " == *" ARGOCD_AUTH_TOKEN "* && -n "$server" && -n "$pinned" && "$pinned" != "$server" ]]; then
            echo "::error::the ArgoCD token of Vault ${VAULT_MOUNT_CI}/ci/shared belongs to '${pinned}', but argocd_server is '${server}'"; exit 1
          fi
          for name in $WANT; do
            value=$(jq -r --arg n "$name" '.[$n] // empty' <<< "$data")
            if [[ -n "$value" ]]; then export_env "$name" "$value"; echo "▸ $name from Vault ${VAULT_MOUNT_CI}/ci/shared"; continue; fi
            fallback_var="FALLBACK_$name"
            if [[ -n "${!fallback_var:-}" ]]; then export_env "$name" "${!fallback_var}"; echo "▸ $name from the secret"; fi
          done

      - name: Check charts repo credentials
        env:
          TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
        run: |
          [[ -n "${CHARTS_REPO_SSH_KEY:-}" || -n "$TOKEN" ]] || { echo "::error::charts_repo is set but CHARTS_REPO_SSH_KEY is not in Vault <vault_mount_ci>/ci/shared and secret CHARTS_REPO_TOKEN is empty"; exit 1; }

      - name: Checkout the GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.charts_repo }}
          ssh-key: ${{ env.CHARTS_REPO_SSH_KEY }}
          token: ${{ env.CHARTS_REPO_SSH_KEY == '' && secrets.CHARTS_REPO_TOKEN || github.token }}
          path: gitops

      - name: Download build meta of every component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-meta-${{ inputs.app }}-*
          path: meta
          merge-multiple: true

      - name: Bump image tags
        id: bump
        working-directory: gitops
        env:
          TEAM: ${{ inputs.team }}
          APP: ${{ inputs.app }}
          ENV: ${{ needs.plan.outputs.env }}
          OVERRIDE: ${{ inputs.charts_values_path }}
          CHARTS_REPO: ${{ inputs.charts_repo }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          TEAM=$(strip "$TEAM"); APP=$(strip "$APP"); ENV=$(strip "$ENV"); OVERRIDE=$(strip "$OVERRIDE")

          chart_dir="charts/${TEAM}/${APP}"
          [[ -d "$chart_dir" ]] || { echo "::error::Chart directory '$chart_dir' not found in ${CHARTS_REPO}"; exit 1; }
          if [[ -n "$OVERRIDE" ]]; then values="$chart_dir/$OVERRIDE"
          elif [[ -f "$chart_dir/values/${ENV}.yaml" ]]; then values="$chart_dir/values/${ENV}.yaml"
          else values="$chart_dir/values.yaml"; fi
          [[ -f "$values" ]] || { echo "::error::Values file '$values' not found"; exit 1; }

          replay="${RUNNER_TEMP}/bump-replay.sh"; : > "$replay"
          set_image() { # <component> <container-path> <repo> <tag>
            local e
            for e in ".components.$1.$2.image.repository = \"$3\"" ".components.$1.$2.image.tag = \"$4\""; do
              yq -i "$e" "$values"; printf 'yq -i %q %q\n' "$e" "$values" >> "$replay"
            done
            echo "▸ components.$1.$2 → $3:$4"
          }
          require_component() {
            local v; v=$(yq -r ".components.$1 // \"\"" "$values")
            [[ -n "$v" && "$v" != "null" ]] || { echo "::error::components.$1 not found in ${values}"; exit 1; }
          }

          mapfile -t rows < <(jq -r '.[] | [.name, .docker_image, .chart_init_containers, .chart_components_extra] | join("|")' <<< "$MATRIX")

          bumped=""; declare -A built=()
          for row in "${rows[@]}"; do
            IFS='|' read -r name image ics_csv extras_csv <<< "$row"
            f="../meta/${APP}/${name}/build-meta.env"; status=""
            [[ -f "$f" ]] && status=$(sed -n 's/^STATUS=//p' "$f" | head -n1)
            [[ "$status" == "success" ]] || { echo "::warning::build of ${name} ended as ${status:-unknown} — its tag stays as it is"; continue; }
            repo="${image%:*}"; tag="${image##*:}"; built["$repo"]="$tag"
            require_component "$name"
            set_image "$name" "containers.main" "$repo" "$tag"
            bumped+="${bumped:+,}${name}"
            IFS=',' read -ra ics <<< "$ics_csv"
            for ic in "${ics[@]}"; do [[ -n "$ic" ]] && set_image "$name" "initContainers.${ic}" "$repo" "$tag"; done
            IFS=',' read -ra extras <<< "$extras_csv"
            for extra in "${extras[@]}"; do
              [[ -n "$extra" ]] || continue
              require_component "$extra"
              set_image "$extra" "containers.main" "$repo" "$tag"
              bumped+=",${extra}"
              for ic in "${ics[@]}"; do
                [[ -n "$ic" ]] || continue
                has=$(yq -r ".components.${extra}.initContainers.${ic} // \"\"" "$values")
                [[ -n "$has" && "$has" != "null" ]] && set_image "$extra" "initContainers.${ic}" "$repo" "$tag"
              done
            done
          done
          [[ -n "$bumped" ]] || { echo "::error::no component of this run was built — nothing to bump"; exit 1; }
          bumped=$(tr ',' '\n' <<< "$bumped" | awk 'NF && !seen[$0]++' | paste -sd, -)

          image_refs() { # <file>: "<path>|<repository>|<tag>" for every image the file names, as a repository/tag pair or as one "repository:tag" string; repository is empty where only the tag is overridden
            yq -N -r 'explode(.) | .. | (
              (select(tag == "!!map") | select(has("tag")) | select(.tag | (tag != "!!map" and tag != "!!seq" and tag != "!!null")) | [(path | join(".")), (.repository // ""), .tag]),
              (select(tag == "!!str") | select(test("^[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?/[A-Za-z0-9._/-]+:[A-Za-z0-9_][A-Za-z0-9._-]*$")) | [(path | join(".")), sub(":[^:/]+$", ""), sub("^.*:", "")])
            ) | join("|")' "$1"
          }
          while IFS='|' read -r where r t; do
            [[ -n "$r" && -n "$t" && -n "${built[$r]:-}" && "$t" != "${built[$r]}" && "$t" != *latest ]] || continue
            echo "::warning::${values}: ${where:-.} stays on ${r}:${t} while this run deploys ${built[$r]} — the bump does not reach it: list the container in chart_init_containers or chart_components_extra, or update it by hand"
          done < <(image_refs "$values")

          refs=""; refs_count=""; refs_ok=true
          while IFS= read -r f; do
            if out=$(image_refs "$f"); then refs+="${out}"$'\n'
            else refs_ok=false; echo "::warning::the image references of ${f} could not be read — cleanup will not prune"; fi
          done < <(find "$chart_dir" -mindepth 1 -type d -name templates -prune -o -type f \( -name '*.yaml' -o -name '*.yml' \) -print | sort)
          refs=$(awk -F'|' 'NF == 3 && $3 != "" { print $2 "|" $3 }' <<< "$refs" | sort -u)
          for repo in "${!built[@]}"; do
            grep -qxF "${repo}|${built[$repo]}" <<< "$refs" && continue
            refs_ok=false; echo "::warning::${repo}:${built[$repo]} was just written to ${values}, but the scan of ${chart_dir} did not find it — cleanup will not prune"
          done
          [[ "$refs_ok" == "true" ]] && refs_count=$(awk 'NF' <<< "$refs" | wc -l | tr -d ' ')

          echo "▸ values diff:"; git --no-pager diff "$values" || true
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "values_file=$values"
            echo "values_url=${GITHUB_SERVER_URL}/${CHARTS_REPO}/blob/HEAD/${values}"
            echo "bumped=$bumped"
            echo "image_refs_count=$refs_count"
            echo "image_refs<<${delim}"; printf '%s\n' "$refs"; echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        working-directory: gitops
        env:
          MESSAGE: "ci(${{ inputs.team }}/${{ inputs.app }}): ${{ needs.plan.outputs.env }} → ${{ needs.plan.outputs.tag }} [${{ steps.bump.outputs.bumped }}]"
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "▸ values already carry this tag — nothing to commit"; exit 0; fi
          git commit -am "$MESSAGE"
          for i in 1 2 3 4 5; do
            if ! git pull --rebase --autostash; then
              git rebase --abort 2>/dev/null || true
              git reset -q --hard '@{upstream}'
              bash -eo pipefail "${RUNNER_TEMP}/bump-replay.sh"
              if git diff --quiet; then echo "▸ the chart already carries these tags — nothing to push"; exit 0; fi
              git commit -qam "$MESSAGE"
              echo "▸ another run changed the same lines — the tags are written again on top of it"
            fi
            git push && exit 0
            echo "▸ push attempt $i failed, retrying"; sleep $((i*3))
          done
          echo "::error::could not push the bump commit after 5 attempts"; exit 1

  sync:
    needs: [plan, bump]
    if: ${{ !cancelled() && inputs.argocd_server != '' && needs.bump.result == 'success' && needs.plan.outputs.apps != '' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      id-token: write
    outputs:
      results: ${{ steps.wait.outputs.results }}
      images: ${{ steps.wait.outputs.images }}
      images_count: ${{ steps.wait.outputs.images_count }}
    env:
      ARGOCD_SERVER: ${{ inputs.argocd_server }}
    steps:
      - name: Read CI credentials from Vault
        env:
          VAULT_SERVER: ${{ inputs.vault_server }}
          VAULT_ROLE: ${{ inputs.vault_role }}
          VAULT_AUTH_PATH: ${{ inputs.vault_auth_path }}
          VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          WANT: ARGOCD_AUTH_TOKEN
          FALLBACK_ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          export_env() { # <name> <value>: masked, multi-line safe
            while IFS= read -r line; do [[ -n "$line" ]] && echo "::add-mask::$line"; done <<< "$2"
            local delim; delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          VAULT_SERVER=$(strip "$VAULT_SERVER"); VAULT_SERVER=${VAULT_SERVER%/}
          VAULT_ROLE=$(strip "$VAULT_ROLE"); VAULT_AUTH_PATH=$(strip "$VAULT_AUTH_PATH"); VAULT_MOUNT_CI=$(strip "$VAULT_MOUNT_CI")
          data="{}"
          if [[ -n "$VAULT_SERVER" && -n "$VAULT_ROLE" && -n "$VAULT_AUTH_PATH" && -n "$VAULT_MOUNT_CI" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            aud=$(jq -rn --arg v "$VAULT_SERVER" '$v | @uri')
            if jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -er .value) \
              && token=$(curl -fsSL --data "{\"role\":\"${VAULT_ROLE}\",\"jwt\":\"${jwt}\"}" "${VAULT_SERVER}/v1/auth/${VAULT_AUTH_PATH}/login" | jq -er .auth.client_token); then
              echo "::add-mask::$token"
              data=$(curl -fsSL -H "X-Vault-Token: $token" "${VAULT_SERVER}/v1/${VAULT_MOUNT_CI}/data/ci/shared" | jq -c '.data.data | objects') || data=""
              [[ -n "$data" ]] || data="{}"
            else
              echo "::warning::Vault login failed - CI credentials come from secrets"
            fi
          fi
          server=$(strip "${ARGOCD_SERVER:-}"); pinned=$(jq -r '.ARGOCD_SERVER // empty' <<< "$data")
          if [[ " $WANT " == *" ARGOCD_AUTH_TOKEN "* && -n "$server" && -n "$pinned" && "$pinned" != "$server" ]]; then
            echo "::error::the ArgoCD token of Vault ${VAULT_MOUNT_CI}/ci/shared belongs to '${pinned}', but argocd_server is '${server}'"; exit 1
          fi
          for name in $WANT; do
            value=$(jq -r --arg n "$name" '.[$n] // empty' <<< "$data")
            if [[ -n "$value" ]]; then export_env "$name" "$value"; echo "▸ $name from Vault ${VAULT_MOUNT_CI}/ci/shared"; continue; fi
            fallback_var="FALLBACK_$name"
            if [[ -n "${!fallback_var:-}" ]]; then export_env "$name" "${!fallback_var}"; echo "▸ $name from the secret"; fi
          done

      - name: Sync, wait for health and list the running images
        id: wait
        env:
          APPS: ${{ needs.plan.outputs.apps }}
          APP_NAME: ${{ inputs.app }}
          TEAM: ${{ inputs.team }}
          TIMEOUT: ${{ inputs.argocd_timeout }}
        run: |
          set -euo pipefail
          strip() { printf '%s' "${1-}" | tr -d '[:space:]'; }
          put() { local d; d="EOF_$(openssl rand -hex 16)"; { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_OUTPUT"; }
          server=$(strip "$ARGOCD_SERVER"); token=$(strip "${ARGOCD_AUTH_TOKEN:-}")
          [[ -n "$token" ]] || { echo "::error::argocd_server is set but ARGOCD_AUTH_TOKEN is in neither Vault <vault_mount_ci>/ci/shared nor the secret"; exit 1; }
          api() { # <method> <path> [json body]: the answer on stdout, non-zero unless the status is 2xx
            local out code args=(-sS -X "$1" -w '\n%{http_code}' -H "Authorization: Bearer ${token}")
            [[ $# -lt 3 ]] || args+=(-H "Content-Type: application/json" --data "$3")
            out=$(curl "${args[@]}" "https://${server}/api/v1/$2") || return 1
            code=${out##*$'\n'}; out=${out%$'\n'*}
            if [[ "$code" == 2?? ]]; then printf '%s' "$out"; return 0; fi
            echo "ArgoCD answered HTTP ${code}: $(jq -r '.message // .error // empty' <<< "$out" 2>/dev/null | head -c 300)" >&2; return 1
          }
          sync_app() { # <app>: start a sync, wait for it, then wait until the app is Synced and Healthy
            local app=$1 st prev deadline err started phase left sync health seen=""
            st=$(api GET "applications/${app}") || return 1
            prev=$(jq -r '.status.operationState.startedAt // ""' <<< "$st")
            deadline=$((SECONDS + TIMEOUT))
            until err=$(api POST "applications/${app}/sync" '{}' 2>&1 >/dev/null); do
              if [[ "$err" != *"another operation is already in progress"* ]] || (( SECONDS >= deadline )); then echo "$err"; return 1; fi
              sleep 5
            done
            while :; do
              st=$(api GET "applications/${app}") || return 1
              started=$(jq -r '.status.operationState.startedAt // ""' <<< "$st"); phase=$(jq -r '.status.operationState.phase // ""' <<< "$st")
              if [[ "$started" != "$prev" ]]; then
                case "$phase" in
                  Succeeded) break ;;
                  Failed|Error) echo "sync ${phase}: $(jq -r '.status.operationState.message // ""' <<< "$st")"; return 1 ;;
                esac
              fi
              (( SECONDS < deadline )) || { echo "the sync did not finish in ${TIMEOUT}s"; return 1; }
              sleep 5
            done
            echo "sync: $(jq -r '.status.operationState.message // "done"' <<< "$st")"
            left=$(jq -r '[.status.operationState.syncResult.resources[]? | select(.status == "PruneSkipped") | .kind + "/" + .name] | join(", ")' <<< "$st")
            [[ -z "$left" ]] || { echo "left in the cluster though the chart no longer has them — prune or delete: ${left}"; return 1; }
            deadline=$((SECONDS + TIMEOUT))
            while :; do
              st=$(api GET "applications/${app}") || return 1
              if [[ "$(jq -r '(.status.reconciledAt // "") >= (.status.operationState.finishedAt // "~")' <<< "$st")" == "true" ]]; then
                sync=$(jq -r '.status.sync.status // "Unknown"' <<< "$st"); health=$(jq -r '.status.health.status // "Unknown"' <<< "$st")
                [[ "$seen" == "${sync}/${health}" ]] || { seen="${sync}/${health}"; echo "state: ${sync}, ${health}"; }
                if [[ "$sync" == "Synced" && "$health" == "Healthy" ]]; then return 0; fi
              fi
              (( SECONDS < deadline )) || { echo "not Synced and Healthy after ${TIMEOUT}s"; return 1; }
              sleep 5
            done
          }

          mapfile -t apps < <(printf '%s\n' "$APPS" | awk 'NF')
          rc=0; results=""
          for app in "${apps[@]}"; do
            echo ""; echo "▸ $app"
            if [[ "$app" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]] && sync_app "$app"; then
              results+="${app}|ok"$'\n'
            else
              echo "::error::sync/health failed for $app"; results+="${app}|fail"$'\n'; rc=1
            fi
          done
          put results "${results%$'\n'}"
          [[ $rc -eq 0 ]] || exit "$rc"

          selector="app=$(strip "$APP_NAME"),team=$(strip "$TEAM")"
          live() {
            local app
            api GET "applications?selector=$(jq -rn --arg s "$selector" '$s | @uri')" | jq -r '.items[]?.status.summary.images[]?' || return 1
            for app in "${apps[@]}"; do api GET "applications/${app}" | jq -r '.status.summary.images[]?' || return 1; done
          }
          count=""
          if images=$(live | sort -u); then
            count=$(awk 'NF' <<< "$images" | wc -l | tr -d ' ')
            echo ""; echo "▸ ${count} image(s) run in the Applications labelled ${selector}"
          else
            images=""; echo "::warning::the running images could not be read from ArgoCD — cleanup will not prune"
          fi
          echo "images_count=$count" >> "$GITHUB_OUTPUT"; put images "$images"

  report:
    needs: [plan, build, scan, cleanup, bump, sync]
    if: ${{ always() }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Download build meta
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-meta-${{ inputs.app }}-*
          path: meta
          merge-multiple: true
        continue-on-error: true

      - name: Download scan reports
        if: ${{ inputs.docker_scan }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-${{ inputs.app }}-*
          path: scan
          merge-multiple: true
        continue-on-error: true

      - name: Write summary
        env:
          TEAM: ${{ inputs.team }}
          APP: ${{ inputs.app }}
          ENV: ${{ needs.plan.outputs.env }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
          DEPLOY_ENABLED: ${{ needs.plan.outputs.deploy_enabled }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUMP_RESULT: ${{ needs.bump.result }}
          BUMP_VALUES: ${{ needs.bump.outputs.values_file }}
          BUMP_VALUES_URL: ${{ needs.bump.outputs.values_url }}
          BUMP_LIST: ${{ needs.bump.outputs.bumped }}
          CHARTS_REPO: ${{ inputs.charts_repo }}
          SYNC_RESULT: ${{ needs.sync.result }}
          SYNC_RESULTS: ${{ needs.sync.outputs.results }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          CLEANUP_NOTE: ${{ needs.cleanup.outputs.note }}
          CLEANUP_KEEP: ${{ inputs.cleanup_keep }}
          CLEANUP_ENABLED: ${{ inputs.cleanup_enabled }}
          SCAN_ENABLED: ${{ inputs.docker_scan }}
          ARGOCD_SERVER: ${{ inputs.argocd_server }}
          VAULT_SERVER: ${{ inputs.vault_server }}
          VAULT_MOUNT_CI: ${{ inputs.vault_mount_ci }}
          VAULT_MOUNT_RUNTIME: ${{ inputs.vault_mount_runtime }}
          LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          S="$GITHUB_STEP_SUMMARY"
          # per-job log links: .../runs/<run>/job/<job_id>
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | {name, url: .html_url}]' 2>/dev/null || echo '[]')
          job_url() { jq -r --arg s "$1" 'map(select(.name|endswith($s)))[0].url // empty' <<<"$jobs_json"; }
          log_link() { local u; u=$(job_url "$1"); echo "[logs](${u:-$LOGS})"; }
          icon() { case "${1:-skipped}" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹";; *) echo "⏭";; esac; }
          row() { echo "| $1 | $2 | $3 |" >> "$S"; }

          echo "## \`${TEAM:+$TEAM/}${APP}\` → \`${ENV:-?}\`${TAG:+ · \`$TAG\`}" >> "$S"
          if [[ "$PLAN_RESULT" != "success" ]]; then echo "$(icon "$PLAN_RESULT") plan ${PLAN_RESULT} — $(log_link plan)" >> "$S"; exit 0; fi
          if [[ -n "$VAULT_SERVER" ]]; then
            v="${VAULT_SERVER%/}/ui/vault/secrets"
            if [[ -n "$VAULT_MOUNT_CI" ]]; then
              echo "build-args: [\`${VAULT_MOUNT_CI}/${TEAM}/${APP}/\`](${v}/${VAULT_MOUNT_CI}/kv/list/${TEAM}/${APP}/)  " >> "$S"
            fi
            if [[ -n "$VAULT_MOUNT_RUNTIME" ]]; then
              echo "runtime-envs: [\`${VAULT_MOUNT_RUNTIME}/${TEAM}/${APP}/\`](${v}/${VAULT_MOUNT_RUNTIME}/kv/list/${TEAM}/${APP}/)  " >> "$S"
            fi
          fi
          echo >> "$S"
          if [[ "$(jq 'length' <<< "${MATRIX:-[]}")" == "0" ]]; then echo "⏭ nothing to build — ${SKIPPED:-no components selected}" >> "$S"; exit 0; fi
          if [[ "${DEPLOY_ENABLED:-}" == "false" ]]; then echo "⏭ no ArgoCD Application for env \`${ENV}\` — nothing deployed" >> "$S"; exit 0; fi

          echo "| Stage | Status | Detail |" >> "$S"; echo "| --- | --- | --- |" >> "$S"

          while IFS=$'\t' read -r name image; do
            [[ -z "$name" ]] && continue
            app_dir=$(printf '%s' "$APP" | tr -d '[:space:]')
            st="$BUILD_RESULT"; f="meta/${app_dir}/${name}/build-meta.env"
            [[ -f "$f" ]] && st=$(sed -n 's/^STATUS=//p' "$f")
            lbl="build"; [[ "$name" != "main" ]] && lbl="build ${name}"
            if [[ "$st" == "success" ]]; then row "🐳 Build \`${name}\`" "✅" "\`${image}\`"
            else row "🐳 Build \`${name}\`" "$(icon "$st")" "$(log_link "$lbl")"; fi
            if [[ "$SCAN_ENABLED" == "true" && "$st" == "success" ]]; then
              c="scan/${app_dir}/${name}/counts.env"; slbl="scan"; [[ "$name" != "main" ]] && slbl="scan ${name}"
              if [[ -f "$c" ]]; then
                n() { sed -n "s/^$1=\([0-9][0-9]*\)\$/\1/p" "$c"; }
                mark="✅"; [[ "$(n CRITICAL)" == "0" ]] || mark="⚠️"
                row "🛡 Scan \`${name}\`" "$mark" "critical $(n CRITICAL) ($(n CRITICAL_FIXABLE) fixable), high $(n HIGH) ($(n HIGH_FIXABLE) fixable) · artifact [\`scan-${APP}-${name}\`](${LOGS}#artifacts)"
              else
                row "🛡 Scan \`${name}\`" "⏭" "no report — $(log_link "$slbl")"
              fi
            fi
          done < <(jq -r '.[] | [.name, .docker_image] | @tsv' <<< "${MATRIX:-[]}")
          while IFS= read -r sk; do sk="${sk#"${sk%%[! ]*}"}"; [[ -z "$sk" ]] && continue; row "🐳 Build \`${sk%%:*}\`" "⏭" "${sk#*: }"; done <<< "${SKIPPED//; /$'\n'}"

          if [[ -n "$CHARTS_REPO" ]]; then
            bump="—"
            [[ -n "$BUMP_VALUES" ]] && bump="[\`${BUMP_VALUES}\`](${BUMP_VALUES_URL}) · ${BUMP_LIST//,/, }"
            [[ "$BUMP_RESULT" == "failure" ]] && bump="$(log_link bump)"
            row "📝 Bump" "$(icon "$BUMP_RESULT")" "$bump"
          fi

          if [[ -n "$ARGOCD_SERVER" && -n "$CHARTS_REPO" ]]; then
            sync=""
            while IFS='|' read -r a outcome; do
              [[ -z "$a" ]] && continue
              mark=""; [[ "$outcome" == "fail" ]] && mark="❌ "
              sync+="${sync:+, }${mark}[\`${a}\`](https://${ARGOCD_SERVER}/applications/${a}?operation=true)"
            done <<< "${SYNC_RESULTS:-}"
            [[ "$SYNC_RESULT" == "failure" && -z "$sync" ]] && sync="$(log_link sync)"
            row "🚀 Sync" "$(icon "$SYNC_RESULT")" "${sync:-—}"
          fi

          if [[ "$CLEANUP_ENABLED" == "true" ]]; then
            case "$CLEANUP_RESULT" in
              success) cl="${CLEANUP_NOTE:-keep ${CLEANUP_KEEP}}" ;;
              failure) cl="$(log_link cleanup)" ;;
              *)       cl="—" ;;
            esac
            row "🧹 Cleanup" "$(icon "$CLEANUP_RESULT")" "$cl"
          fi
          true

  notify:
    needs: [plan, build, bump, sync]
    if: failure()
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions: {}
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      TG_THREAD: ${{ secrets.TELEGRAM_THREAD }}
    steps:
      - name: Send Telegram notification
        if: env.TG_TOKEN != ''
        env:
          APP: ${{ inputs.team != '' && format('{0}/{1}', inputs.team, inputs.app) || inputs.app }}
          ENV: ${{ needs.plan.outputs.env }}
          BRANCH: ${{ github.ref_name }}
          LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr '`\n' "' "; }
          # shellcheck disable=SC2016
          text=$(printf '🔥 *CI/CD failed*\n\n- app: `%s`\n- env: `%s`\n- repo: `%s`\n- branch: `%s`\n- actor: `%s`\n\n[logs](%s)' \
            "$(clean "$APP")" "$(clean "$ENV")" "$GITHUB_REPOSITORY" "$(clean "$BRANCH")" "$GITHUB_ACTOR" "$LOGS")
          args=(--data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${text}")
          [[ -z "$TG_THREAD" ]] || args+=(--data-urlencode "message_thread_id=${TG_THREAD}")
          curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" "${args[@]}"
